name: Deploy Ktor Realtime Service
on:
    workflow_dispatch:
        inputs:
            environment:
                description: "Target environment"
                required: true
                type: choice
                options:
                    - staging
                    - production
                default: staging
            confirm:
                description: 'Type "deploy" to confirm'
                required: true

env:
    GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.caching=true"

    JAR_DIR: /opt/socius
    ENV_FILE: /opt/socius/.env

    JAR_NAME: socius-realtime-service.jar
    SERVICE_NAME: socius-realtime.service

jobs:
    validate:
        name: Validate Input
        runs-on: ubuntu-latest
        steps:
            - name: Check Confirmation
              run: |
                  if [[ "${{ inputs.confirm }}" != "deploy" ]]; then
                    echo "❌ Deployment cancelled."
                    exit 1
                  fi

    pre-check:
        name: Check Server
        runs-on: ubuntu-latest
        needs: validate
        steps:
            - uses: appleboy/ssh-action@v1.2.0
              env:
                  JAR_DIR: ${{ env.JAR_DIR }}
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  envs: JAR_DIR
                  script: |
                      AVAILABLE=$(df "$JAR_DIR" | tail -1 | awk '{print $4}')
                      if [ "$AVAILABLE" -lt 512000 ]; then echo "❌ Disk full"; exit 1; fi
                      if ! java -version 2>&1 | grep -q "17\."; then echo "❌ Java 17 required"; exit 1; fi
                      echo "✅ Server ready"

    build:
        name: Build Ktor
        runs-on: ubuntu-latest
        needs: pre-check
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  java-version: "17"
                  distribution: "temurin"
                  cache: "gradle"

            - name: Build Shadow Jar
              run: |
                  chmod +x gradlew
                  ./gradlew clean shadowJar -x test --parallel --build-cache

            - name: Prepare JAR
              run: |
                  mkdir -p ./upload-artifacts

                  # Tìm file *-all.jar
                  KTOR_JAR=$(find build/libs -name '*-all.jar' -type f | head -1)

                  if [[ -z "$KTOR_JAR" ]]; then
                    echo "❌ Fat JAR (*-all.jar) not found in build/libs"
                    ls -R build/libs
                    exit 1
                  fi

                  echo "Found JAR: $KTOR_JAR"
                  cp "$KTOR_JAR" ./upload-artifacts/${{ env.JAR_NAME }}

            - uses: actions/upload-artifact@v4
              with:
                  name: app-jar
                  path: ./upload-artifacts/*.jar
                  retention-days: 1

    deploy:
        name: Deploy to Azure
        runs-on: ubuntu-latest
        needs: build
        environment:
            name: ${{ inputs.environment }}
            url: https://socius.codes/ws/hub
        steps:
            - uses: actions/download-artifact@v4
              with:
                  name: app-jar
                  path: ./artifacts

            - name: SCP to Server
              uses: appleboy/scp-action@v0.1.7
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  source: "artifacts/*.jar"
                  target: "/tmp/socius-deploy"
                  strip_components: 1
                  overwrite: true

            - name: SSH Execute Deploy
              uses: appleboy/ssh-action@v1.2.0
              env:
                  JAR_DIR: ${{ env.JAR_DIR }}
                  JAR_NAME: ${{ env.JAR_NAME }}
                  SERVICE_NAME: ${{ env.SERVICE_NAME }}
                  ENV_FILE: ${{ env.ENV_FILE }}
              with:
                  host: ${{ secrets.VM_HOST }}
                  username: ${{ secrets.VM_USER }}
                  key: ${{ secrets.SSH_PRIVATE_KEY }}
                  envs: JAR_DIR,JAR_NAME,SERVICE_NAME,ENV_FILE
                  script: |
                      set -euo pipefail
                      echo "🚀 Deploying Ktor..."

                      # 1. Backup file JAR cũ
                      if [ -f "$JAR_DIR/$JAR_NAME" ]; then
                          sudo cp "$JAR_DIR/$JAR_NAME" "$JAR_DIR/$JAR_NAME.bak"
                      fi

                      # 2. Di chuyển file JAR mới vào
                      sudo mv /tmp/socius-deploy/${{ env.JAR_NAME }} "$JAR_DIR/"

                      # Set quyền cho file JAR
                      sudo chown azureuser:azureuser "$JAR_DIR/$JAR_NAME"
                      sudo chmod 500 "$JAR_DIR/$JAR_NAME"

                      # [QUAN TRỌNG] Chỉ đảm bảo quyền đọc cho file .env (Không ghi đè nội dung)
                      if [ -f "$ENV_FILE" ]; then
                          sudo chown azureuser:azureuser "$ENV_FILE"
                          sudo chmod 600 "$ENV_FILE"
                      else
                          echo "⚠️ Warning: $ENV_FILE not found on server!"
                      fi

                      # 3. Restart Service
                      echo "Restarting service..."
                      if ! sudo systemctl restart "$SERVICE_NAME"; then
                           echo "❌ Restart Failed. Rolling back..."
                           if [ -f "$JAR_DIR/$JAR_NAME.bak" ]; then
                              sudo mv "$JAR_DIR/$JAR_NAME.bak" "$JAR_DIR/$JAR_NAME"
                              sudo systemctl restart "$SERVICE_NAME"
                           fi
                           sudo journalctl -u $SERVICE_NAME -n 50 --no-pager
                           exit 1
                      fi

                      sudo rm -rf /tmp/socius-deploy
                      echo "✅ Deployment SUCCESS!"
