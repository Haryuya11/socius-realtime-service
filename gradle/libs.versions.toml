[versions]
# Core Versions
kotlin = "2.2.21"
ktor = "3.3.2"
logback = "1.5.23"
rabbitmq = "5.28.0"
coroutines = "1.10.2"
serializationJson = "1.9.0"

# Azure Versions
azureKeyvault = "4.10.4"
azureIdentity = "1.18.1"

nimbusJoseJwt = "10.5"
auth0Jwt = "4.5.0"

# Plugin Versions
spotless = "8.0.0"
dokka = "2.1.0"
ktlint = "1.8.0"
shadow = "9.3.0"
detekt = "1.23.8"

[libraries]
# Ktor Libraries
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
ktor-server-cors = { module = "io.ktor:ktor-server-cors", version.ref = "ktor" }
ktor-server-call-logging = { module = "io.ktor:ktor-server-call-logging", version.ref = "ktor" }
ktor-server-content-negotiation = { module = "io.ktor:ktor-server-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-server-websockets = { module = "io.ktor:ktor-server-websockets", version.ref = "ktor" }
ktor-server-auth = { module = "io.ktor:ktor-server-auth", version.ref = "ktor" }
ktor-server-auth-jwt = { module = "io.ktor:ktor-server-auth-jwt", version.ref = "ktor" }
ktor-server-test-host = { module = "io.ktor:ktor-server-test-host", version.ref = "ktor" }

# Kotlin & Coroutines
kotlin-test-junit = { module = "org.jetbrains.kotlin:kotlin-test-junit", version.ref = "kotlin" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serializationJson" }

# Third Party
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
rabbitmq-client = { module = "com.rabbitmq:amqp-client", version.ref = "rabbitmq" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbusJoseJwt" }
auth0-jwt = { module = "com.auth0:java-jwt", version.ref = "auth0Jwt" }

# Azure
azure-security-keyvault = { module = "com.azure:azure-security-keyvault-secrets", version.ref = "azureKeyvault" }
azure-identity = { module = "com.azure:azure-identity", version.ref = "azureIdentity" }

# Bundle (Gom nhóm lại để import cho gọn)
[bundles]
ktor-server = [
    "ktor-server-core",
    "ktor-server-netty",
    "ktor-server-cors",
    "ktor-server-call-logging",
    "ktor-server-content-negotiation",
    "ktor-serialization-kotlinx-json",
    "ktor-server-websockets",
    "ktor-server-auth",
    "ktor-server-auth-jwt"
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktor = { id = "io.ktor.plugin", version.ref = "ktor" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
